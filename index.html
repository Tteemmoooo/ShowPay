<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="收PAY">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>收PAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:GRAD,opsz,ROND,wdth,wght@0,18,100,100,400..900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f5;--surface:#fff;--ink:#152920;--muted:#617369;--line:#dce8e0;--primary:#156d5d;--soft:#e8f3ed;--positive:#187658;--negative:#c1534d}
*{box-sizing:border-box}
@font-face{font-family:'JF Open Huninn';src:url('https://cdn.jsdelivr.net/gh/justfont/open-huninn-font@master/font/jf-openhuninn-2.1.ttf') format('truetype');font-display:swap}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Google Sans Flex','JF Open Huninn',Roboto,Arial,sans-serif;font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;font-variation-settings:'ROND' 100,'opsz' 18}
button,input,textarea,select{font-variation-settings:'ROND' 100,'opsz' 18}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}
.wrap{max-width:680px;margin:auto;padding:10px 12px 20px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{padding:4px 0 9px 7px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:49px}
.brand{display:flex;align-items:center;justify-content:flex-start;gap:7px;white-space:nowrap;min-width:0}
.brandEmoji{font-size:24px;line-height:1}
.langSwitch{justify-self:end;display:flex;align-items:center;gap:2px;padding:3px;background:#e4eee8;border-radius:12px}
.langBtn{border:0;background:transparent;border-radius:9px;padding:5px 8px;min-height:31px;font-size:13px;font-weight:750;color:#526a60}
.langBtn.selected{background:#fff;color:var(--primary);box-shadow:0 1px 4px #123e3218}
.langBtn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media(max-width:350px){.title{font-size:20px}.brandEmoji{font-size:21px}.langBtn{padding:5px 6px}}
.title{font-size:23px;font-weight:800;letter-spacing:-.5px}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;margin:0 0 12px;background:#e5eee9;border-radius:16px;position:sticky;top:0;z-index:10}
.tab{border:0;border-radius:12px;background:transparent;min-height:43px;font-size:16px;font-weight:750;color:#516c61}
.tab.active{background:#fff;color:#106753;box-shadow:0 2px 7px #164c3e12}
.panel{display:none}.panel.active{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:11px}
.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:9px;margin:0 0 11px}
.sectionTitle{font-size:18px;line-height:1.3;font-weight:780;margin:0}
.tiny{font-size:14px}.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 13px;min-height:43px;border-radius:13px;font-size:15px;font-weight:730;white-space:nowrap}
.btn.primary{background:var(--primary);border-color:var(--primary);color:white}
.btn.small{font-size:14px;padding:7px 10px;min-height:36px;border-radius:10px}
.btn.fill{width:100%}.btn.danger{color:var(--negative);border-color:#eedbd8}
.btn:active,.tab:active{transform:scale(.986)}
.control{background:#fcfdfc;border:1px solid #d8e5de;border-radius:12px;padding:10px 11px;min-height:44px;width:100%;font-size:16px;min-width:0;outline:none}
.control:focus{border-color:#207e6c;box-shadow:0 0 0 3px #207e6c1a}
.inlineAdd{display:flex;align-items:stretch;gap:8px}.inlineAdd .control{flex:1;min-height:56px;resize:vertical}.inlineAdd .btn{align-self:stretch}
.inputHint{margin:7px 1px 0;color:var(--muted);font-size:14px;line-height:1.4}
.siteFooter{margin-top:auto;padding:18px 4px max(9px,env(safe-area-inset-bottom));text-align:center;color:var(--muted);font-size:13px;line-height:1.55}
.siteFooter .footerBrand{font-weight:700;color:var(--ink)}
.field{display:block;margin:11px 0}.field>span,.field .fieldTitle{display:block;color:var(--muted);font-weight:700;font-size:14px;margin:0 0 5px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.row{display:flex;align-items:center;gap:9px}.row>*{min-width:0}
.pile{display:grid;gap:6px}.person{display:flex;align-items:center;gap:7px;background:#fafcfb;border:1px solid #e4ebe7;padding:7px;border-radius:12px}
.avatar{width:38px;min-width:38px;height:39px;display:grid;place-items:center;background:var(--soft);border:1px solid #d3e7dc;border-radius:11px;font-size:23px;line-height:1;padding:0}
.avatar:focus-visible,.emojiChoice:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.emojiGrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin:14px 0 8px}
.emojiChoice{display:grid;place-items:center;min-width:0;min-height:43px;padding:4px;background:#f4faf6;border:1px solid #e1ebe4;border-radius:12px;font-size:25px}
.emojiChoice.active{background:#dceddf;border-color:var(--primary)}
.person .control{min-height:39px;padding:7px 9px}.personName{flex:1}.personGroup{flex:none;width:124px}
.iconBtn{border:0;background:#edf4ef;color:#62786d;border-radius:9px;width:31px;height:34px;font-size:21px}
.groupPreview{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.groupTag{background:var(--soft);color:var(--primary);padding:6px 10px;border-radius:99px;font-weight:700;font-size:14px}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;background:#eaf2ec;padding:4px;border-radius:14px}
.seg button{border:0;background:transparent;border-radius:10px;min-height:42px;padding:8px 1px;color:#526d60;font-size:14px;font-weight:750}
.seg button.selected{background:#fff;color:var(--primary);box-shadow:0 1px 5px #163d3512}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.chip{border:1px solid #dce8e0;background:#fff;border-radius:11px;padding:9px 11px;display:flex;align-items:center;gap:5px;font-size:15px;font-weight:700}
.chip.selected{background:var(--soft);color:var(--primary);border-color:#8cb9aa}.check{font-weight:850;font-size:14px}
.optionSwitch{display:flex;justify-content:space-between;align-items:center;background:#f4f8f5;border-radius:12px;padding:11px;margin:12px 0 0}.optionSwitch label{font-size:14px;font-weight:700}.optionSwitch input{width:20px;height:20px;accent-color:var(--primary)}
.splitRow{display:flex;gap:10px;justify-content:space-between;align-items:center;background:#f6faf7;border-radius:12px;padding:7px 10px;margin-bottom:7px}
.splitRow .control{max-width:134px;min-height:41px}
.entry{border:1px solid #e2ebe5;border-radius:13px;padding:10px;margin-bottom:7px}
.entryTop{display:flex;justify-content:space-between;align-items:center;gap:7px}.entryTitle{font-weight:750;word-break:break-word;min-width:0;font-size:15px}
.entryMeta{color:var(--muted);font-size:14px;line-height:1.4;overflow-wrap:anywhere;margin-top:5px}
.entryAmt{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:15px}.ledgerActions{display:flex;gap:6px;align-items:center}
.tag{background:#e7f2eb;color:#2a6b53;border-radius:7px;padding:4px 6px;font-size:12px;font-weight:740;margin-right:6px}
.tag.game{background:#e7eff9;color:#3a699a}.tag.debt{background:#fff1e0;color:#99672d}.tag.paid{background:#e7f6ed;color:var(--primary)}
.empty{padding:15px 10px;border:1px dashed #e0e9e2;background:#f9fcfa;border-radius:12px;text-align:center;color:var(--muted);font-size:15px}
.viewSwitch{display:grid;grid-template-columns:1fr 1fr;background:#ecf3ef;border-radius:12px;padding:3px;gap:3px}
.viewSwitch button{border:0;border-radius:10px;background:transparent;min-height:41px;font-size:15px;font-weight:760;color:#5b7266}
.viewSwitch button.active{background:#fff;color:var(--primary);box-shadow:0 1px 5px #142d2310}
.settleHeading{margin:15px 2px 5px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.settleHeading h2{margin:0;font-size:17px;font-weight:780}.settleHeading .muted{font-size:14px}
.payRow{display:flex;align-items:center;gap:9px;border-bottom:1px solid #e2ebe5;padding:10px 0;min-height:57px}
.payRow:last-child{border-bottom:0}.payNames{display:flex;align-items:center;gap:5px;min-width:0;flex:1;font-weight:750;font-size:16px;line-height:1.3}
.personBubble{min-width:0;overflow-wrap:anywhere}.arrow{color:#6f9586;flex:none}.payAmount{font-weight:850;white-space:nowrap;font-size:17px;font-variant-numeric:tabular-nums}
.payRow .btn{min-height:36px;padding:7px 11px;font-size:14px;flex:none}
.net{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}.positive{color:var(--positive)}.negative{color:var(--negative)}
.matrixScroll{overflow-x:auto;overflow-y:visible;max-width:100%;overscroll-behavior-x:contain;border:1px solid var(--line);border-radius:13px;scrollbar-width:thin}
.matrix{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:15px;font-variant-numeric:tabular-nums}
.matrix th,.matrix td{padding:9px 10px;text-align:right;border-bottom:1px solid #e7eee9;white-space:nowrap;min-width:96px;height:48px;background:#fff}
.matrix thead th{background:#eef5f0;color:#2c5142;font-weight:780;vertical-align:middle;border-bottom:1px solid #d2e5d9;height:62px;position:sticky;top:0;z-index:2}
.matrix th .matrixMeta{display:block;font-weight:580;color:#687f71;font-size:12px;margin-top:3px;max-width:126px;text-overflow:ellipsis;overflow:hidden}
.matrix th .matrixLabel{display:block;max-width:126px;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;text-align:left;min-width:90px;max-width:145px;z-index:3;border-right:1px solid var(--line);font-weight:760}
.matrix th:first-child{z-index:5;background:#eef5f0}
.matrix th:last-child,.matrix td:last-child{position:sticky;right:0;z-index:3;min-width:96px;font-weight:800;border-left:1px solid #dce9e1;background:#eff7f1}
.matrix th:last-child{z-index:5;background:#deeee4}
.matrixPerson{display:block;max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.matrix tr:last-child td{border-bottom:0}.matrix .zero{color:#acb9b0}.matrix .groupRow td{background:#f4faf6;font-weight:770;border-top:2px solid #d5e7da}.matrix .groupRow td:first-child{background:#f4faf6}.matrix .groupRow td:last-child{background:#e4f1e8}
.matrixNote{color:var(--muted);font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 2px 0}
.clearRow{margin:19px 0 0;display:flex;justify-content:center}.clearRow .btn{color:var(--negative);border:0;background:transparent;font-size:14px}
.modalBackdrop{position:fixed;inset:0;background:#142d2599;z-index:30;display:grid;place-items:center;padding:14px}
.modal{background:white;border-radius:20px;padding:20px;width:min(410px,100%)}.modal h2{font-size:21px;margin:0 0 9px}.modal p{font-size:16px;color:var(--muted);line-height:1.5}.modalBtns{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.alert{background:#fff3f2;color:#a63e37;border:1px solid #f3d7d4;border-radius:11px;padding:12px}
.hidden{display:none!important}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:50;background:#1c4438;color:white;padding:11px 15px;border-radius:12px;font-size:14px;max-width:92vw;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}#toast.show{opacity:1}
@media(max-width:390px){.wrap{padding:9px 9px 30px}.card{padding:11px}.payNames{font-size:15px}.payAmount{font-size:16px}.payRow{gap:6px}.payRow .btn{padding:7px 9px}.personGroup{width:104px}.person .control{padding:7px 6px}.matrix th:first-child,.matrix td:first-child{max-width:90px}.matrix td{padding:8px 8px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand"><span class="brandEmoji" aria-hidden="true">💸</span><div class="title">收PAY</div></div><div class="langSwitch" role="group" aria-label="Language"><button class="langBtn selected" data-lang="en" type="button" aria-pressed="true">EN</button><button class="langBtn" data-lang="zh" type="button" aria-pressed="false">中</button></div></header>
<nav class="tabs" role="tablist" aria-label="Sections">
<button class="tab active" type="button" data-tab="people" role="tab" aria-selected="true">People</button>
<button class="tab" type="button" data-tab="entries" role="tab" aria-selected="false">Entries</button>
<button class="tab" type="button" data-tab="results" role="tab" aria-selected="false">Settle</button>
</nav>
<section id="peoplePanel" class="panel active" role="tabpanel">
<div class="card"><div class="sectionHead"><h2 class="sectionTitle">Add people</h2><span class="muted tiny" id="peopleCount">0</span></div>
<div class="inlineAdd"><textarea class="control" id="peopleInput" rows="2" placeholder="A, B, C ..." aria-label="Names, separated by commas or lines" aria-describedby="peopleHint"></textarea><button class="btn primary" id="btnAddPeople" type="button">Add</button></div><p id="peopleHint" class="inputHint">One name per line, or use commas / semicolons.</p></div>
<div class="card"><div class="sectionHead"><h2 class="sectionTitle">People & groups</h2></div><div id="peopleList" class="pile"></div><div id="groupPreview" class="groupPreview"></div></div>
<button class="btn primary fill" type="button" data-go="entries">Continue →</button>
<div class="clearRow"><button class="btn" type="button" id="btnReset">Clear all data</button></div>
</section>
<section id="entriesPanel" class="panel" role="tabpanel">
<div class="card"><div class="sectionHead"><h2 class="sectionTitle">New entry</h2></div>
<div class="seg" id="entryModes"><button class="selected" type="button" data-mode="expense">Expense</button><button type="button" data-mode="game">Game</button><button type="button" data-mode="debt">Debt</button><button type="button" data-mode="paid">Paid</button></div><div id="entryForm"></div></div>
<div class="card"><div class="sectionHead"><h2 class="sectionTitle">Entries</h2><span class="muted tiny" id="entryCount">0</span></div><div id="entryList"></div></div>
<button class="btn primary fill" type="button" data-go="results">View settlement →</button>
</section>
<section id="resultsPanel" class="panel" role="tabpanel">
<div class="viewSwitch" role="group" aria-label="Settlement view"><button type="button" class="active" data-view="transfers" aria-pressed="true">Transfers</button><button type="button" data-view="matrix" aria-pressed="false">Matrix</button></div>
<div id="transfersView"><div class="settleHeading"><h2>Suggested transfers</h2><span class="muted" id="transferCount">0 pending</span></div>
<div class="card"><div id="transferList"></div></div></div>
<div id="matrixView" class="hidden"><div class="settleHeading"><h2>Breakdown</h2></div><div id="matrixContainer"></div></div>
</section>
<footer class="siteFooter"><div class="footerBrand">© 2026 收PAY · v1.0.1</div><div>No account · Saved on this device</div></footer>
</div>
<div id="modalContainer"></div><div id="toast" role="status"></div>
<script>
'use strict';
const localeKey='showpay_language_v1';
let language='en';
try{language=localStorage.getItem(localeKey)==='zh'?'zh':'en'}catch{}
const zhMap={
 'Language':'語言','Sections':'分頁','People':'人員','Entries':'帳目','Settle':'找數',
 'One name per line, or use commas / semicolons.':'每行輸入一個名字，亦可用逗號或分號分隔。',
 'No account · Saved on this device':'無需帳戶 · 資料儲存喺呢部裝置',
 'Add people':'加入人員','People & groups':'人員及分組','Add':'新增',
 'Continue →':'下一步 →','Clear all data':'清除所有資料','New entry':'新增帳目',
 'Expense':'開支','Game':'遊戲','Debt':'欠款','Paid':'已付',
 'View settlement →':'查看找數 →','Transfers':'過數','Matrix':'明細表',
 'Suggested transfers':'建議過數','Breakdown':'收支明細','Item':'項目',
 'Amount (HKD)':'金額 (HKD)','Paid by':'付款人','Split among':'分攤人',
 'All':'全選','None':'清除','Custom amounts':'自訂金額','Add expense':'加入開支',
 'Players':'玩家','Add game result':'加入遊戲結果','Note':'備註','From':'付款人','To':'收款人',
 'Owes':'欠款人','Receives':'收款人','Record payment':'記錄已過數','Add debt':'加入欠款',
 'Solo':'個人','Choose person':'選擇人員','Choose players to enter winnings (+) and losses (−)':'選擇玩家，再輸入贏 (+) 或輸 (−) 的金額',
 'Add at least 2 people first':'請先加入最少兩個人','Add names to begin':'加入名字開始',
 'No entries yet':'暫無帳目','Person':'人員','Net':'淨額','+ Credit · − Owed':'+ 應收 · − 應付',
 'Swipe ↔':'左右滑動 ↔','All settled ✓':'全部已清 ✓','Add people and entries to begin':'先加入人員同帳目',
 'Settlement breakdown matrix':'找數明細矩陣','Paid':'已付','Unknown':'未知',
 'Remove':'移除','Remove person?':'移除人員？','Delete entry?':'刪除帳目？','Delete':'刪除',
 'Cancel':'取消','Confirm':'確認','Reset':'清除','Reset all data?':'清除所有資料？',
 'Delete people, entries, and payments from this device?':'刪除呢部裝置上所有人員、帳目及過數紀錄？',
 'Delete entries for this person first':'請先刪除涉及此人嘅帳目',
 'Choose emoji':'選擇 Emoji','Change emoji':'更換 Emoji',
 'Name cannot be empty or duplicate':'名稱唔可以留空或重複',
 'Unable to save on this device':'無法喺呢部裝置儲存',
 'Use an amount with up to 2 decimal places':'金額最多只可以有兩位小數',
 'Amount is too large':'金額過大','Enter an amount above zero':'請輸入大於零嘅金額',
 'Add at least one unique name':'請輸入最少一個新名字',
 'Select payer and participants':'請選擇付款人同分攤人員',
 'Invalid expense amount':'開支金額不正確','Split does not match total':'分攤金額同總額不符',
 'Invalid game result':'遊戲輸贏金額不正確','Game totals must equal $0':'遊戲輸贏合計必須等於 $0',
 'Select valid people and amount':'請選擇正確人員及金額',
 'Select who shares this expense':'請選擇分攤人員',
 'Split amounts cannot be negative':'分攤金額唔可以係負數',
 'Choose at least 2 players':'請選擇最少兩名玩家',
 'Enter game results':'請輸入遊戲輸贏','Entry added':'已加入帳目','Entry deleted':'已刪除帳目',
 'Reset complete':'已清除所有資料','Invalid entry':'帳目資料不正確',
 'Entries are not balanced':'帳目總數唔平衡','Unable to balance transfers':'無法完成找數計算',
 'FPS / Cash':'轉數快／現金','Adjustment':'調整','Dinner':'晚餐',
 'Game 1':'遊戲 1','Name':'名字','Remove':'移除','Delete entry':'刪除帳目',
 'Settlement':'找數','Payment':'已付款','Settle':'找數'
};
const sourceTexts=new WeakMap();
const sourceAttrs=new WeakMap();
function translateText(en){
 const text=String(en),trim=text.trim();
 let tr=zhMap[trim];
 if(!tr){
  let m;
  if((m=/^Change emoji for (.+)$/.exec(trim)))tr='更改 '+m[1]+' 嘅 Emoji';
  else if((m=/^With (.+)$/.exec(trim)))tr='與 '+m[1]+' 同組';
  else if((m=/^(\d+) pending$/.exec(trim)))tr=m[1]+' 筆待過數';
  else if((m=/^(\d+) added$/.exec(trim)))tr='已加入 '+m[1]+' 人';
  else if((m=/^Remove (.+)\?$/.exec(trim)))tr='移除 '+m[1]+'？';
  else if((m=/^(.+) will be removed\.$/.exec(trim)))tr=m[1]+' 將被刪除。';
  else if((m=/^Mark (.+) as paid$/.exec(trim)))tr='標記 '+m[1]+' 已付';
  else if((m=/^Payment recorded · (.+)$/.exec(trim)))tr='已記錄過數 · '+m[1];
  else if((m=/^Split must total (.+)$/.exec(trim)))tr='分攤總額必須等於 '+m[1];
  else if((m=/^(.+) paid$/.exec(trim)))tr=m[1]+' 已付款';
  else if(trim.includes(' paid · '))tr=trim.replace(' paid · ',' 已付款 · ');
  else return text;
 }
 return text.replace(trim,tr);
}
function translateNodeText(n){
 const old=sourceTexts.get(n);
 const original=old&&n.nodeValue===old.shown?old.original:n.nodeValue;
 if(!original||!original.trim())return;
 const shown=language==='zh'?translateText(original):original;
 if(n.nodeValue!==shown)n.nodeValue=shown;
 sourceTexts.set(n,{original,shown});
}
function translateAttributes(el){
 const saved=sourceAttrs.get(el)||{};
 for(const attr of ['placeholder','aria-label','title']){
  if(!el.hasAttribute(attr))continue;
  const current=el.getAttribute(attr),old=saved[attr];
  const original=old&&current===old.shown?old.original:current;
  const shown=language==='zh'?translateText(original):original;
  if(current!==shown)el.setAttribute(attr,shown);
  saved[attr]={original,shown};
 }
 sourceAttrs.set(el,saved);
}
function localizePage(){
 document.documentElement.lang=language==='zh'?'zh-Hant':'en';
 document.querySelectorAll('[data-lang]').forEach(el=>{

function parseMoney(v,allowNeg=false){const t=String(v??'').trim();if(!new RegExp(allowNeg?'^-?\\d+(?:\\.\\d{1,2})?$':'^\\d+(?:\\.\\d{1,2})?$').test(t))throw Error('Use an amount with up to 2 decimal places');const c=Math.round(Number(t)*100);if(!Number.isSafeInteger(c)||Math.abs(c)>1000000000)throw Error('Amount is too large');if(!allowNeg&&c<=0)throw Error('Enter an amount above zero');return c}

function validateState(s){if(!s||s.version!==1||!Array.isArray(s.people)||!Array.isArray(s.entries))throw Error('Invalid backup');const ids=new Set();s.people.forEach(p=>{if(!p||typeof p.id!=='string'||typeof p.name!=='string'||!p.name.trim()||ids.has(p.id))throw Error('Invalid people');ids.add(p.id)});s.people.forEach(p=>{if(p.groupWith!=null&&p.groupWith!==''&&(!ids.has(p.groupWith)||p.groupWith===p.id))throw Error('Invalid settlement group')});s.entries.forEach(e=>{if(!e||!['expense','game','debt','paid'].includes(e.type)||typeof e.id!=='string')throw Error('Invalid entry')});return s}

function resetDraft(){expenseDraft={members:new Set(state.people.map(p=>p.id)),custom:false,parts:{},label:'',amount:'',payer:''};gameDraft={members:new Set(),deltas:{},label:''};extraDraft={debt:{label:'',amount:'',from:'',to:''},paid:{label:'',amount:'',from:'',to:''}}}

function addPeople(raw){const names=raw.split(/[,，、;；\n]+/).map(x=>x.trim()).filter(Boolean);const current=new Set(state.people.map(p=>p.name.toLocaleLowerCase()));let count=0;names.forEach(n=>{if(n.length>40||current.has(n.toLocaleLowerCase()))return;state.people.push({id:id(),name:n,emoji:emojiList[state.people.length%emojiList.length],groupWith:''});current.add(n.toLocaleLowerCase());count++});if(!count)throw Error('Add at least one unique name');expenseDraft.members=new Set(state.people.map(p=>p.id));changed();toast(count+' added')}
function settlementGroups(){const ids=state.people.map(p=>p.id),parent=new Map(ids.map(x=>[x,x]));const root=x=>{while(parent.get(x)!==x){parent.set(x,parent.get(parent.get(x)));x=parent.get(x)}return x};for(const p of state.people)if(p.groupWith&&parent.has(p.groupWith))parent.set(root(p.id),root(p.groupWith));const groups=[];for(const p of state.people){const r=root(p.id);let g=groups.find(x=>x.key===r);if(!g){g={key:r,members:[],representative:p.id};groups.push(g)}g.members.push(p.id)}return groups}
function groupFor(pid){return settlementGroups().find(g=>g.members.includes(pid))}

function renderPeople(){ $('peopleCount').textContent=String(state.people.length);const groups=settlementGroups();$('peopleList').innerHTML=state.people.length?state.people.map((p,i)=>{const g=groups.find(x=>x.members.includes(p.id));const mate=g.members.find(x=>x!==p.id)||'';return `<div class="person"><button class="avatar" type="button" data-edit-emoji="${h(p.id)}" title="Change emoji" aria-label="Change emoji for ${h(p.name)}">${h(personEmoji(p.id))}</button><input class="control personName" aria-label="Name" data-rename="${h(p.id)}" value="${h(p.name)}" maxlength="40"><select class="control personGroup" aria-label="Settlement group for ${h(p.name)}" data-group="${h(p.id)}"><option value="">Solo</option>${state.people.filter(x=>x.id!==p.id).map(x=>`<option value="${h(x.id)}" ${mate===x.id?'selected':''}>With ${h(x.name)}</option>`).join('')}</select><button class="iconBtn" data-remove-person="${h(p.id)}" title="Remove" aria-label="Remove ${h(p.name)}">×</button></div>`}).join(''):'<div class="empty">Add names to begin</div>';$('groupPreview').innerHTML=groups.filter(g=>g.members.length>1).map(g=>`<span class="groupTag">${h(g.members.map(displayName).join(' + '))}</span>`).join('')}

function modeHtml(){if(state.people.length<2)return '<div class="empty" style="margin-top:12px">Add at least 2 people first</div>';if(mode==='expense')return `<div class="grid2"><label class="field"><span>Item</span><input class="control" id="eLabel" placeholder="Dinner" maxlength="60" value="${h(expenseDraft.label)}"></label><label class="field"><span>Amount (HKD)</span><input class="control" id="eAmount" inputmode="decimal" placeholder="800" value="${h(expenseDraft.amount)}"></label></div><label class="field"><span>Paid by</span><select class="control" id="ePayer">${peopleOptions(expenseDraft.payer)}</select></label><div class="field"><div class="row" style="justify-content:space-between"><span class="fieldTitle" style="margin:0">Split among</span><div><button class="btn small" type="button" data-quick-select="all">All</button> <button class="btn small" type="button" data-quick-select="none">None</button></div></div>${chips(expenseDraft.members,'member')}</div><div class="optionSwitch"><label for="customSplit">Custom amounts</label><input id="customSplit" type="checkbox" ${expenseDraft.custom?'checked':''}></div><div id="customFields">${customHtml()}</div><button type="button" class="btn primary fill" id="btnAddEntry" style="margin-top:13px">Add expense</button>`;
if(mode==='game')return `<label class="field"><span>Game</span><input class="control" id="gLabel" placeholder="Game 1" maxlength="60" value="${h(gameDraft.label)}"></label><div class="field"><div class="row" style="justify-content:space-between"><span class="fieldTitle" style="margin:0">Players</span><button class="btn small" type="button" data-quick-game="all">All</button></div>${chips(gameDraft.members,'gmember')}</div><div id="gameFields">${gameFieldsHtml()}</div><button class="btn primary fill" type="button" id="btnAddEntry" style="margin-top:13px">Add game result</button>`;
const isPaid=mode==='paid';return `<label class="field"><span>Note</span><input class="control" id="xLabel" maxlength="60" value="${h(extraDraft[mode].label)}" placeholder="${isPaid?'FPS / Cash':'Adjustment'}"></label><div class="grid2"><label class="field"><span>${isPaid?'From':'Owes'}</span><select class="control" id="xFrom">${peopleOptions(extraDraft[mode].from)}</select></label><label class="field"><span>${isPaid?'To':'Receives'}</span><select class="control" id="xTo">${peopleOptions(extraDraft[mode].to)}</select></label></div><label class="field"><span>Amount (HKD)</span><input class="control" id="xAmount" inputmode="decimal" placeholder="100" value="${h(extraDraft[mode].amount)}"></label><button class="btn primary fill" type="button" id="btnAddEntry">${isPaid?'Record payment':'Add debt'}</button>`}
function customHtml(){if(!expenseDraft.custom)return '';return [...expenseDraft.members].map(pid=>`<div class="splitRow"><strong class="playerLabel">${h(displayName(pid))}</strong><input class="control" data-part="${h(pid)}" inputmode="decimal" placeholder="0.00" value="${h(expenseDraft.parts[pid]??'')}"></div>`).join('')}
function gameFieldsHtml(){if(!gameDraft.members.size)return '<div class="empty">Choose players to enter winnings (+) and losses (−)</div>';return [...gameDraft.members].map(pid=>`<div class="splitRow"><strong class="playerLabel">${h(displayName(pid))}</strong><input class="control" data-delta="${h(pid)}" inputmode="decimal" placeholder="+150 / -50" value="${h(gameDraft.deltas[pid]??'')}"></div>`).join('')}
function renderForm(){document.querySelectorAll('#entryModes button').forEach(b=>b.classList.toggle('selected',b.dataset.mode===mode));$('entryForm').innerHTML=modeHtml();localizePage()}
function validateRefs(e){const allowed=new Set(state.people.map(p=>p.id));if(e.type==='expense'){if(!allowed.has(e.payer)||!Array.isArray(e.members)||!e.members.length||e.members.some(pid=>!allowed.has(pid)))throw Error('Select payer and participants');if(!Number.isSafeInteger(e.amount)||e.amount<=0)throw Error('Invalid expense amount');if(e.parts&& (e.parts.length!==e.members.length||e.parts.some(x=>!Number.isSafeInteger(x)||x<0)||e.parts.reduce((a,b)=>a+b,0)!==e.amount))throw Error('Split does not match total')}else if(e.type==='game'){const pairs=Object.entries(e.deltas||{});if(pairs.some(([pid,c])=>!allowed.has(pid)||!Number.isSafeInteger(c)))throw Error('Invalid game result');if(pairs.reduce((sum,[,v])=>sum+v,0)!==0)throw Error('Game totals must equal $0')}else {if(!allowed.has(e.from)||!allowed.has(e.to)||e.from===e.to||!Number.isSafeInteger(e.amount)||e.amount<=0)throw Error('Select valid people and amount')}}
function addEntry(){let e={id:id(),type:mode,label:'',time:Date.now()};if(mode==='expense'){e.label=$('eLabel').value.trim()||'Expense';e.amount=parseMoney($('eAmount').value);e.payer=$('ePayer').value;e.members=state.people.map(p=>p.id).filter(pid=>expenseDraft.members.has(pid));if(!e.members.length)throw Error('Select who shares this expense');if(expenseDraft.custom){e.parts=e.members.map(pid=>parseMoney(expenseDraft.parts[pid]??'0',true));if(e.parts.some(n=>n<0))throw Error('Split amounts cannot be negative');if(e.parts.reduce((a,b)=>a+b,0)!==e.amount)throw Error('Split must total '+fmt(e.amount))}}
if(mode==='game'){e.label=$('gLabel').value.trim()||'Game';const list=[...gameDraft.members];if(list.length<2)throw Error('Choose at least 2 players');e.deltas={};for(const pid of list){const val=(gameDraft.deltas[pid]??'').trim();e.deltas[pid]=val?parseMoney(val,true):0}if(Object.values(e.deltas).every(n=>n===0))throw Error('Enter game results');if(Object.values(e.deltas).reduce((a,b)=>a+b,0)!==0)throw Error('Game totals must equal $0')}
if(mode==='debt'||mode==='paid'){e.label=$('xLabel').value.trim()||(mode==='paid'?'Payment':'Debt');e.amount=parseMoney($('xAmount').value);e.from=$('xFrom').value;e.to=$('xTo').value}
validateRefs(e);state.entries.push(e);resetDraft();changed();toast('Entry added')}
function expensesParts(e){if(Array.isArray(e.parts))return e.parts;const base=Math.floor(e.amount/e.members.length),rem=e.amount%e.members.length;return e.members.map((_,i)=>base+(i<rem?1:0))}
function compute(){const rows=Object.fromEntries(state.people.map(p=>[p.id,{expense:0,game:0,debt:0,paid:0,net:0}]));const add=(pid,k,c)=>{if(!rows[pid])throw Error('Missing person in entry');rows[pid][k]+=c;rows[pid].net+=c};let sumPaid=0;for(const e of state.entries){validateRefs(e);if(e.type==='expense'){add(e.payer,'expense',e.amount);expensesParts(e).forEach((c,i)=>add(e.members[i],'expense',-c))}else if(e.type==='game'){Object.entries(e.deltas).forEach(([pid,c])=>add(pid,'game',c))}else if(e.type==='debt'){add(e.from,'debt',-e.amount);add(e.to,'debt',e.amount)}else if(e.type==='paid'){add(e.from,'paid',e.amount);add(e.to,'paid',-e.amount);sumPaid+=e.amount}}const nets=Object.entries(rows).map(([pid,r])=>({pid,c:r.net}));if(nets.reduce((a,b)=>a+b.c,0)!==0)throw Error('Entries are not balanced');const groups=settlementGroups().map(g=>({...g,c:g.members.reduce((sum,pid)=>sum+rows[pid].net,0)}));const debtors=groups.filter(x=>x.c<0).map(x=>({pid:x.representative,c:-x.c})).sort((a,b)=>b.c-a.c),creditors=groups.filter(x=>x.c>0).map(x=>({pid:x.representative,c:x.c})).sort((a,b)=>b.c-a.c);const transfers=[];let i=0,j=0;while(i<debtors.length&&j<creditors.length){const amount=Math.min(debtors[i].c,creditors[j].c);if(amount<=0)break;transfers.push({from:debtors[i].pid,to:creditors[j].pid,amount});debtors[i].c-=amount;creditors[j].c-=amount;if(!debtors[i].c)i++;if(!creditors[j].c)j++}if(i<debtors.length||j<creditors.length)throw Error('Unable to balance transfers');return{rows,groups,transfers,outstanding:groups.filter(x=>x.c>0).reduce((a,b)=>a+b.c,0),sumPaid}}
function entryDetails(e){if(e.type==='expense'){const portions=expensesParts(e);return `${displayName(e.payer)} paid · ${e.members.map((pid,i)=>`${displayName(pid)} ${fmt(portions[i])}`).join(', ')}`}if(e.type==='game')return Object.entries(e.deltas).map(([pid,c])=>`${displayName(pid)} ${signed(c)}`).join(', ');return `${displayName(e.from)} → ${displayName(e.to)}`}
function renderEntries(){const tags={expense:'Expense',game:'Game',debt:'Debt',paid:'Paid'};$('entryCount').textContent=String(state.entries.length);$('entryList').innerHTML=state.entries.length?state.entries.slice().reverse().map(e=>`<div class="entry"><div class="entryTop"><div class="entryTitle"><span class="tag ${e.type}">${tags[e.type]}</span>${h(e.label)}</div><div class="ledgerActions">${e.amount?`<span class="entryAmt">${fmt(e.amount)}</span>`:''}<button class="iconBtn" data-remove-entry="${h(e.id)}" title="Delete entry" aria-label="Delete entry">×</button></div></div><div class="entryMeta">${h(entryDetails(e))}</div></div>`).join(''):'<div class="empty">No entries yet</div>'}
function detailOfRow(r){return [['Game',r.game],['Expense',r.expense],['Debt',r.debt],['Paid',r.paid]].filter(([,v])=>v!==0).map(([k,v])=>`${k} ${signed(v)}`).join(' · ')}
function entryEffect(e,pid){
  if(e.type==='game')return e.deltas[pid]||0;
  if(e.type==='expense'){
    let c=e.payer===pid?e.amount:0;
    e.members.forEach((p,i)=>{if(p===pid)c-=expensesParts(e)[i]});return c;
  }
  if(e.type==='debt')return (e.to===pid?e.amount:0)-(e.from===pid?e.amount:0);
  if(e.type==='paid')return (e.from===pid?e.amount:0)-(e.to===pid?e.amount:0);
  return 0;
}
function shortSigned(c){if(!c)return '<span class="zero">—</span>';const n=(Math.abs(c)/100).toLocaleString('en-HK',{maximumFractionDigits:2});return `<span class="${c>0?'positive':'negative'}">${c>0?'+':'−'}$${n}</span>`}
function renderMatrix(rows,groups){
  const container=$('matrixContainer');
  if(!state.people.length){container.innerHTML='<div class="empty">Add people to begin</div>';return;}
  const entries=state.entries;
  const labels={expense:'Expense',game:'Game',debt:'Debt',paid:'Paid'};
  const headers=entries.map(e=>{
    const detail=e.type==='expense'?`${name(e.payer)} paid`:e.type==='paid'||e.type==='debt'?`${name(e.from)} → ${name(e.to)}`:labels[e.type];
    return `<th title="${h(e.label)} · ${h(detail)}"><span class="matrixLabel">${h(e.label)}</span><span class="matrixMeta">${h(detail)}</span></th>`;
  }).join('');
  const renderRow=(label,pids,group=false)=>{
    const net=pids.reduce((a,pid)=>a+rows[pid].net,0);
    const cells=entries.map(e=>`<td>${shortSigned(pids.reduce((a,pid)=>a+entryEffect(e,pid),0))}</td>`).join('');
    return `<tr class="${group?'groupRow':''}"><td title="${h(label)}"><span class="matrixPerson">${h(label)}</span></td>${cells}<td>${shortSigned(net)}</td></tr>`;
  };
  const peopleRows=state.people.map(p=>renderRow(displayName(p.id),[p.id])).join('');
  const groupRows=groups.filter(g=>g.members.length>1).map(g=>renderRow(g.members.map(displayName).join(' + '),g.members,true)).join('');
  container.innerHTML=`<div class="matrixScroll" role="region" aria-label="Settlement breakdown matrix" tabindex="0"><table class="matrix"><thead><tr><th>Person</th>${headers}<th>Net</th></tr></thead><tbody>${peopleRows}${groupRows}</tbody></table></div><div class="matrixNote"><span>+ Credit · − Owed</span><span>Swipe ↔</span></div>`;
}
function renderResults(){
  let data;try{data=compute()}catch(err){$('transferList').innerHTML=$('matrixContainer').innerHTML=`<div class="alert">${h(err.message)}</div>`;return;}
  const {rows,groups,transfers}=data;
  $('transferCount').textContent=transfers.length+' pending';
  $('transferList').innerHTML=transfers.length?transfers.map((t,i)=>`<div class="payRow"><div class="payNames"><span class="personBubble">${h(settlementName(t.from))}</span><span class="arrow">→</span><span class="personBubble">${h(settlementName(t.to))}</span></div><span class="payAmount">${fmt(t.amount)}</span><button class="btn primary small" data-fully="${i}" type="button" aria-label="Mark ${h(settlementName(t.from))} to ${h(settlementName(t.to))} ${fmt(t.amount)} as paid">Paid</button></div>`).join(''):`<div class="empty">${state.people.length?'All settled ✓':'Add people and entries to begin'}</div>`;
  renderMatrix(rows,groups);
}

 });
 localizePage();
 target.querySelector('[data-emoji-choice]')?.focus();
}
function recordPaid(t){const e={id:id(),type:'paid',label:'Settlement',time:Date.now(),from:t.from,to:t.to,amount:t.amount};validateRefs(e);state.entries.push(e);changed();toast('Payment recorded · '+fmt(t.amount))}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.go)));
$('btnAddPeople').addEventListener('click',()=>{try{addPeople($('peopleInput').value);$('peopleInput').value=''}catch(e){toast(e.message)}});
$('peopleInput').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')$('btnAddPeople').click()});
$('peopleList').addEventListener('change',e=>{const group=e.target.dataset.group;if(group){setGroup(group,e.target.value);return}const pid=e.target.dataset.rename;if(!pid)return;const p=state.people.find(x=>x.id===pid);if(!p)return;const n=e.target.value.trim();if(!n||state.people.some(x=>x.id!==pid&&x.name.toLowerCase()===n.toLowerCase())){e.target.value=p.name;toast('Name cannot be empty or duplicate');return}p.name=n;changed()});
$('peopleList').addEventListener('click',e=>{const picker=e.target.closest('[data-edit-emoji]');if(picker){openEmojiPicker(picker.dataset.editEmoji);return}const btn=e.target.closest('[data-remove-person]');if(btn)removePerson(btn.dataset.removePerson)});
$('entryModes').addEventListener('click',e=>{const m=e.target.closest('[data-mode]')?.dataset.mode;if(m){mode=m;renderForm()}});
$('entryForm').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='btnAddEntry'){try{addEntry()}catch(error){toast(error.message)}return}if(b.dataset.member){if(expenseDraft.members.has(b.dataset.member))expenseDraft.members.delete(b.dataset.member);else expenseDraft.members.add(b.dataset.member);renderForm();return}if(b.dataset.gmember){if(gameDraft.members.has(b.dataset.gmember))gameDraft.members.delete(b.dataset.gmember);else gameDraft.members.add(b.dataset.gmember);renderForm();return}if(b.dataset.quickSelect){expenseDraft.members=new Set(b.dataset.quickSelect==='all'?state.people.map(p=>p.id):[]);renderForm();return}if(b.dataset.quickGame){gameDraft.members=new Set(state.people.map(p=>p.id));renderForm()}});
function syncField(el){const k=el.id,v=el.value;if(k==='eLabel')expenseDraft.label=v;else if(k==='eAmount')expenseDraft.amount=v;else if(k==='ePayer')expenseDraft.payer=v;else if(k==='gLabel')gameDraft.label=v;else if(k==='xLabel')extraDraft[mode].label=v;else if(k==='xAmount')extraDraft[mode].amount=v;else if(k==='xFrom')extraDraft[mode].from=v;else if(k==='xTo')extraDraft[mode].to=v}
$('entryForm').addEventListener('change',e=>{syncField(e.target);if(e.target.id==='customSplit'){expenseDraft.custom=e.target.checked;const el=$('customFields');if(el){el.innerHTML=customHtml();localizePage()}}});
$('entryForm').addEventListener('input',e=>{syncField(e.target);if(e.target.dataset.part)expenseDraft.parts[e.target.dataset.part]=e.target.value;if(e.target.dataset.delta)gameDraft.deltas[e.target.dataset.delta]=e.target.value});
$('entryList').addEventListener('click',e=>{const b=e.target.closest('[data-remove-entry]');if(b)deleteEntry(b.dataset.removeEntry)});
$('transferList').addEventListener('click',e=>{const b=e.target.closest('[data-fully]');if(!b)return;const t=compute().transfers[Number(b.dataset.fully)];if(t)recordPaid(t)});
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setSettleView(b.dataset.view)));
$('btnReset').addEventListener('click',async()=>{if(!await confirmBox('Reset all data?','Delete people, entries, and payments from this device?','Reset',true))return;state=baseState();resetDraft();changed();setTab('people');toast('Reset complete')});
renderAll();
setSettleView(settleView);
if('serviceWorker' in navigator && location.protocol==='https:'){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Offline mode unavailable',err)));
}
</script>
</body>
</html>
